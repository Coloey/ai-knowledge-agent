services:
  nginx:
    image: ${WEB_IMAGE:-ai-knowledge-agent-web:latest}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    depends_on:
      - backend-api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

  backend-api:
    image: ${BACKEND_IMAGE:-ai-knowledge-agent-backend:latest}
    build:
      context: ../backend
    env_file:
      - ../backend/.env
    depends_on:
      - postgres
      - redis
      - minio
    command: >
      gunicorn app.main:app
      -k uvicorn.workers.UvicornWorker
      -b 0.0.0.0:8000
      --workers 2
      --timeout 300
    expose:
      - "8000"
    volumes:
      - storage_data:/app/storage

  worker:
    image: ${BACKEND_IMAGE:-ai-knowledge-agent-backend:latest}
    env_file:
      - ../backend/.env
    depends_on:
      - postgres
      - redis
      - minio
    command: celery -A app.workers.celery_app worker -l info
    volumes:
      - storage_data:/app/storage

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent}
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
  storage_data:
