server {
  listen 80;
  server_name _;

  client_max_body_size 50m;

  location /healthz {
    proxy_pass http://backend-api:8000/healthz;
  }

  location /notta-brain/session/send-message {
    proxy_pass http://backend-api:8000/notta-brain/session/send-message;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://backend-api:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /auth/ {
    proxy_pass http://backend-api:8000/auth/;
  }

  location /workspaces {
    proxy_pass http://backend-api:8000/workspaces;
  }

  location /library/ {
    proxy_pass http://backend-api:8000/library/;
  }

  location /notta-brain/ {
    proxy_pass http://backend-api:8000/notta-brain/;
  }
}
