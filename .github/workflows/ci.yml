name: AI Knowledge Agent CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: agent
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agent -d agent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @agent/backend format:check
      - run: pnpm test
      - run: pnpm --filter @agent/backend build
      - run: pnpm --filter @agent/backend db:migrate
        env:
          APP_ENV: test
          AI_PROVIDER: local
          DATABASE_URL: postgresql://agent:agent@localhost:5432/agent
          QUEUE_REDIS_URL: redis://localhost:6379/0
          CONTROL_REDIS_URL: redis://localhost:6379/1
