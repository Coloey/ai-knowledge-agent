[project]
name = "ai-knowledge-agent-backend"
version = "0.1.0"
description = "FastAPI backend for AI knowledge management and SmartBar SSE chat."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.2",
  "boto3>=1.34.0",
  "celery[redis]>=5.4.0",
  "email-validator>=2.2.0",
  "fastapi>=0.115.0",
  "gunicorn>=22.0.0",
  "httpx>=0.27.0",
  "openai>=1.99.0",
  "passlib[bcrypt]>=1.7.4",
  "pgvector>=0.3.2",
  "psycopg[binary]>=3.2.1",
  "pydantic-settings>=2.4.0",
  "pypdf>=4.3.1",
  "python-docx>=1.1.2",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.9",
  "python-pptx>=0.6.23",
  "redis>=5.0.8",
  "sqlalchemy>=2.0.32",
  "uvicorn[standard]>=0.30.6"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8",
  "ruff>=0.6.2"
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
